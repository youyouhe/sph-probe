name: deploy-rn2

on:
  push:
    branches: [main]

concurrency:
  group: deploy-rn2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SPH_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 107.173.223.214 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync to rn2 (排除 data/ 运行时与 .git/.github)
        run: |
          rsync -az --exclude data/ --exclude .git/ --exclude .github/ \
            ./ root@107.173.223.214:/opt/sph/

      - name: Restart sph-probe
        run: |
          ssh root@107.173.223.214 'systemctl restart sph-probe && sleep 2 && systemctl is-active sph-probe'
